[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/term",
    "crates/gui",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kuc6708/rustterm"
authors = ["rustterm contributors"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
vt100 = "0.15"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
eframe = "0.29"
